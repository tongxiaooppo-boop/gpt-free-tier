<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>C 手機首頁</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@700&amp;display=swap">
<style>body{margin:0}a{color:#2F4FA8}a:hover{color:#1E3780}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F0; color: #1F2430; font-family: 'Noto Sans TC', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex-grow: 1; overflow: hidden; padding: 20px 18px 0; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 28px; line-height: 1.3">今天想做什麼？</h1>
    <div style="background: #FFFFFF; border: 1px solid #E8E0D2; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 16px; font-weight: 700">今天的免費額度還剩</div>
      <div style="display: flex; gap: 10px">
        <div style="flex: 1; background: #EEF2FB; border-radius: 12px; padding: 10px 12px">
          <div style="font-size: 13px; color: #4A5060">大組 sol・astra</div>
          <div style="font-size: 24px; font-weight: 700; color: #2F4FA8">82%</div>
        </div>
        <div style="flex: 1; background: #EEF2FB; border-radius: 12px; padding: 10px 12px">
          <div style="font-size: 13px; color: #4A5060">小組 luna・terra</div>
          <div style="font-size: 24px; font-weight: 700; color: #2F4FA8">87%</div>
        </div>
      </div>
      <div style="font-size: 13px; color: #4A5060">每天早上 8 點（台灣）重新計算</div>
    </div>
    <div style="font-size: 14px; color: #4A5060; background: #FFF1DC; border-radius: 12px; padding: 8px 12px">提醒：無法上網查資料，內容會分享給 OpenAI，請勿輸入私密資訊。</div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 15px; font-weight: 700; color: #4A5060">{{g.name}}</div>
        <sc-for list="{{g.items}}" as="c" hint-placeholder-count="3">
          <a href="C-card.dc.html" style="text-decoration: none; color: #1F2430; background: #FFFFFF; border: 1px solid #E8E0D2; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; min-height: 56px">
            <span style="width: 40px; height: 40px; border-radius: 12px; background: #2F4FA8; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{c.g}}</span>
            <span style="display: flex; flex-direction: column; flex-grow: 1">
              <span style="font-size: 18px; font-weight: 700">{{c.t}}</span>
              <span style="font-size: 13px; color: #4A5060">{{c.d}}</span>
            </span>
          </a>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <nav style="height: 72px; background: #FFFFFF; border-top: 1px solid #E8E0D2; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a href="#" style="text-decoration: none; color: #2F4FA8; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 14px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z"></path></svg>首頁</a>
    <a href="#" style="text-decoration: none; color: #4A5060; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 14px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h14v16H5zM9 9h6M9 13h6"></path></svg>紀錄</a>
    <a href="#" style="text-decoration: none; color: #4A5060; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 14px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path></svg>設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { groups: [
      { name: '拍照', items: [
        { g: '拍', t: '拍照翻譯', d: '菜單、路標、說明書' },
        { g: '字', t: '拍照轉文字', d: '把照片裡的字打出來' } ] },
      { name: '文字', items: [
        { g: '譯', t: '翻譯', d: '保留格式與專有名詞' },
        { g: '摘', t: '摘要', d: '整理成重點條列' },
        { g: '白', t: '易讀版改寫', d: '公文通知改成白話' } ] }
    ] };
  }
}
</script>
</body>
</html>
